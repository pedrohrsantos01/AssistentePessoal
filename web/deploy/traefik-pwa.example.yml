# Merge into the existing Coolify provider; do not replace its proxy or ACME.
# Reserved hostname/services; entrypoints must match the actual installation.
http:
  routers:
    ritmo-pwa-http:
      rule: "Host(`ritmo.example.test`)"
      entryPoints: [web]
      middlewares: [ritmo-pwa-https]
      service: ritmo-static
    ritmo-pwa-api:
      rule: "Host(`ritmo.example.test`) && (Path(`/api`) || PathPrefix(`/api/`))"
      priority: 200
      entryPoints: [websecure]
      middlewares: [ritmo-pwa-security]
      service: ritmo-api
      tls:
        options: ritmo-pwa@file
    ritmo-pwa-static:
      rule: "Host(`ritmo.example.test`)"
      priority: 100
      entryPoints: [websecure]
      middlewares: [ritmo-pwa-security]
      service: ritmo-static
      tls:
        options: ritmo-pwa@file
  services:
    ritmo-api:
      loadBalancer:
        serversTransport: ritmo-pwa
        servers:
          - url: "http://ritmo-api:8080"
    ritmo-static:
      loadBalancer:
        serversTransport: ritmo-pwa
        servers:
          - url: "http://ritmo-static:8080"
  serversTransports:
    ritmo-pwa:
      forwardingTimeouts:
        dialTimeout: 5s
        responseHeaderTimeout: 25s
        idleConnTimeout: 60s
  middlewares:
    ritmo-pwa-https:
      redirectScheme:
        scheme: https
        permanent: true
    ritmo-pwa-security:
      headers:
        stsSeconds: 31536000
        stsIncludeSubdomains: false
        stsPreload: false
        contentTypeNosniff: true
        referrerPolicy: no-referrer
        frameDeny: true
        customRequestHeaders:
          Forwarded: ""
          X-Real-IP: ""
tls:
  options:
    ritmo-pwa:
      minVersion: VersionTLS12
# No fixture certificate here. Retain Coolify's actual ACME configuration.
