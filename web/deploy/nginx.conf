# Static-only reference; NOT a deployment of web/dist (which is a technical probe).
# Run unprivileged on the private edge network; publish no host port.
pid /tmp/ritmo-nginx.pid;
error_log /dev/stderr warn;
events { worker_connections 128; }
http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log off;
    server_tokens off;
    client_body_temp_path /tmp/ritmo-client-body;
    proxy_temp_path /tmp/ritmo-proxy;
    fastcgi_temp_path /tmp/ritmo-fastcgi;
    uwsgi_temp_path /tmp/ritmo-uwsgi;
    scgi_temp_path /tmp/ritmo-scgi;
    map $status $ritmo_default_cache {
        default "no-cache";
        ~^[45] "no-store";
    }
    map "$status:$uri" $ritmo_cache {
        default $ritmo_default_cache;
        ~^[23][0-9][0-9]:/.*\.html$ "no-store";
        "~^(200|206|304):/assets/[A-Za-z0-9._-]+-[A-Za-z0-9_-]{8,}\.(js|css)$" "public, max-age=31536000, immutable";
    }
    server {
        listen 8080;
        root /usr/share/nginx/html;
        index index.html;
        add_header Cache-Control $ritmo_cache always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy no-referrer always;
        add_header X-Frame-Options DENY always;
        # A routing mistake must fail closed, never turn an API response into HTML.
        location = /api { return 404; }
        location ^~ /api/ { return 404; }
        location = /coordination.html { return 404; }
        location = /probe { return 404; }
        location ^~ /probe/ { return 404; }
        location ^~ /src/ { return 404; }
        location ^~ /node_modules/ { return 404; }
        location ~ /\. { return 404; }
        location = /sw.js { try_files $uri =404; }
        location = /manifest.webmanifest { default_type application/manifest+json; try_files $uri =404; }
        location ^~ /assets/ { try_files $uri =404; }
        # Missing scripts/styles/fonts/etc must never receive index.html.
        location ~ \.[^/]+$ { try_files $uri =404; }
        location / { try_files $uri $uri/ /index.html; }
        # GET permits HEAD; no mutation is served by the static container.

    }
}
