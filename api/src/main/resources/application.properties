spring.application.name=ritmo-api
spring.datasource.url=${RITMO_DB_URL}
spring.datasource.username=${RITMO_DB_USER}
spring.datasource.password=${RITMO_DB_PASSWORD}
spring.flyway.url=${RITMO_DB_URL}
spring.flyway.user=${RITMO_MIGRATION_USER}
spring.flyway.password=${RITMO_MIGRATION_PASSWORD}
ritmo.identity.url=${RITMO_DB_URL}
ritmo.identity.username=${RITMO_IDENTITY_USER}
ritmo.identity.password=${RITMO_IDENTITY_PASSWORD}
ritmo.signing-key=${RITMO_SIGNING_KEY}
spring.jackson.deserialization.fail-on-unknown-properties=true
server.error.include-message=never
server.error.include-stacktrace=never

# Recovery is unavailable until host, HTTPS origin and sender are configured.
ritmo.recovery.origin=${RITMO_PUBLIC_ORIGIN:}
ritmo.recovery.from=${RITMO_MAIL_FROM:}
spring.mail.host=${RITMO_SMTP_HOST:}
spring.mail.port=${RITMO_SMTP_PORT:587}
spring.mail.username=${RITMO_SMTP_USER:}
spring.mail.password=${RITMO_SMTP_PASSWORD:}
spring.mail.default-encoding=UTF-8
spring.mail.properties.mail.smtp.auth=${RITMO_SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.ssl.checkserveridentity=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# Q32: trust the TCP peer until the operational proxy allowlist is configured.
server.forward-headers-strategy=none
ritmo.proxy.trusted-peers=${RITMO_TRUSTED_PROXY_PEERS:}
ritmo.rate-limits.max-buckets=${RITMO_RATE_MAX_BUCKETS:10000}
ritmo.rate-limits.api-ip.capacity=${RITMO_RATE_API_IP_CAPACITY:300}
ritmo.rate-limits.api-ip.period-seconds=${RITMO_RATE_API_IP_PERIOD_SECONDS:60}
ritmo.rate-limits.account.capacity=${RITMO_RATE_ACCOUNT_CAPACITY:120}
ritmo.rate-limits.account.period-seconds=${RITMO_RATE_ACCOUNT_PERIOD_SECONDS:60}
ritmo.rate-limits.login.capacity=${RITMO_RATE_LOGIN_CAPACITY:10}
ritmo.rate-limits.login.period-seconds=${RITMO_RATE_LOGIN_PERIOD_SECONDS:60}
ritmo.rate-limits.register.capacity=${RITMO_RATE_REGISTER_CAPACITY:5}
ritmo.rate-limits.register.period-seconds=${RITMO_RATE_REGISTER_PERIOD_SECONDS:60}
ritmo.rate-limits.reset-request.capacity=${RITMO_RATE_RESET_REQUEST_CAPACITY:3}
ritmo.rate-limits.reset-request.period-seconds=${RITMO_RATE_RESET_REQUEST_PERIOD_SECONDS:900}
ritmo.rate-limits.reset-confirm.capacity=${RITMO_RATE_RESET_CONFIRM_CAPACITY:10}
ritmo.rate-limits.reset-confirm.period-seconds=${RITMO_RATE_RESET_CONFIRM_PERIOD_SECONDS:60}
ritmo.rate-limits.refresh.capacity=${RITMO_RATE_REFRESH_CAPACITY:60}
ritmo.rate-limits.refresh.period-seconds=${RITMO_RATE_REFRESH_PERIOD_SECONDS:60}
ritmo.rate-limits.revoke.capacity=${RITMO_RATE_REVOKE_CAPACITY:60}
ritmo.rate-limits.revoke.period-seconds=${RITMO_RATE_REVOKE_PERIOD_SECONDS:60}

# External to restored data; activate before starting an API over recovered storage.
ritmo.operations.quarantined=${RITMO_RECOVERY_QUARANTINE:false}

# Mandatory for external operation; disposable development may omit the WAL receiver.
ritmo.operations.require-wal=${RITMO_REQUIRE_WAL:false}
ritmo.operations.wal-wait-ms=${RITMO_WAL_WAIT_MS:2000}

# Q49/Q50: bounded daily maintenance, independent from backup schedule.
ritmo.sync-retention.enabled=${RITMO_SYNC_RETENTION_ENABLED:true}
ritmo.sync-retention.poll-ms=${RITMO_SYNC_RETENTION_POLL_MS:60000}
ritmo.sync-retention.period-seconds=${RITMO_SYNC_RETENTION_PERIOD_SECONDS:86400}
ritmo.sync-retention.accounts=${RITMO_SYNC_RETENTION_ACCOUNTS:20}
ritmo.sync-retention.batch-records=${RITMO_SYNC_RETENTION_BATCH_RECORDS:500}
ritmo.sync-retention.budget-ms=${RITMO_SYNC_RETENTION_BUDGET_MS:20000}
ritmo.sync-retention.io-seconds=${RITMO_SYNC_RETENTION_IO_SECONDS:5}
