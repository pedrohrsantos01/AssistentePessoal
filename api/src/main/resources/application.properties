spring.application.name=ritmo-api
spring.datasource.url=${RITMO_DB_URL}
spring.datasource.username=${RITMO_DB_USER}
spring.datasource.password=${RITMO_DB_PASSWORD}
spring.flyway.url=${RITMO_DB_URL}
spring.flyway.user=${RITMO_MIGRATION_USER}
spring.flyway.password=${RITMO_MIGRATION_PASSWORD}
ritmo.identity.url=${RITMO_DB_URL}
ritmo.identity.username=${RITMO_IDENTITY_USER}
ritmo.identity.password=${RITMO_IDENTITY_PASSWORD}
ritmo.signing-key=${RITMO_SIGNING_KEY}
spring.jackson.deserialization.fail-on-unknown-properties=true
server.error.include-message=never
server.error.include-stacktrace=never

# Recovery is unavailable until host, HTTPS origin and sender are configured.
ritmo.recovery.origin=${RITMO_PUBLIC_ORIGIN:}
ritmo.recovery.from=${RITMO_MAIL_FROM:}
spring.mail.host=${RITMO_SMTP_HOST:}
spring.mail.port=${RITMO_SMTP_PORT:587}
spring.mail.username=${RITMO_SMTP_USER:}
spring.mail.password=${RITMO_SMTP_PASSWORD:}
spring.mail.default-encoding=UTF-8
spring.mail.properties.mail.smtp.auth=${RITMO_SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.ssl.checkserveridentity=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
