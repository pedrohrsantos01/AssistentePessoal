plugins {
    id 'java'
    id 'org.springframework.boot' version '4.1.1'
}
group = 'dev.ritmo'
version = '0.1.0'
java { toolchain { languageVersion = JavaLanguageVersion.of(21) } }
repositories { mavenCentral() }
dependencies {
    implementation platform('org.springframework.boot:spring-boot-dependencies:4.1.1')
    implementation platform('org.springframework.modulith:spring-modulith-bom:2.1.1')
    implementation 'org.springframework.boot:spring-boot-starter-webmvc'
    implementation 'org.springframework.boot:spring-boot-starter-jdbc'
    implementation 'org.springframework.boot:spring-boot-starter-flyway'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-mail'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-security-oauth2-resource-server'
    implementation 'com.bucket4j:bucket4j_jdk17-core:8.20.0'
    implementation 'org.bouncycastle:bcprov-jdk18on:1.83'
    implementation 'org.springframework.modulith:spring-modulith-starter-core'
    implementation 'org.flywaydb:flyway-database-postgresql'
    implementation 'com.ibm.icu:icu4j:78.1'
    implementation 'io.github.erdtman:java-json-canonicalization:1.1'
    implementation 'com.networknt:json-schema-validator:3.0.6'
    runtimeOnly 'org.postgresql:postgresql'
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'com.icegreen:greenmail:2.1.14'
    testImplementation 'org.springframework.modulith:spring-modulith-starter-test'
    testImplementation 'org.testcontainers:testcontainers-postgresql'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}
dependencyLocking { lockAllConfigurations() }
tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8'; options.compilerArgs += ['-Xlint:deprecation'] }
tasks.named('test') {
    useJUnitPlatform()
    // Scope cached Spring contexts and static Testcontainers to one class/worker.
    // Keep fixtures sequential; no production/WAL deadline or assertion is relaxed.
    forkEvery = 1
    maxParallelForks = 1
    // RuntimeTests also execute these TypeScript clients and their SQLite migrations.
    inputs.files(fileTree('../app/src'), fileTree('../app/test'), fileTree('../app/drizzle'), fileTree('../app/drizzle-control'))
    inputs.files(fileTree('../app/harness'))
    inputs.files(fileTree('ops').matching { include '*.sh', '*.sql', '*.py', '*.service', '*.timer', '*.conf', '*.sudoers', 'probe-command', 'fetch-probe', 'fetch-detector', 'fetch-primary' })
    // Packaging fixture must be rerun when build inputs change.
    inputs.files(fileTree('src/test/fixtures/receiver'), fileTree('src/test/fixtures/schedule'), fileTree('src/test/fixtures/transport'), fileTree('src/test/fixtures/proxy'), fileTree('deploy/proxy'), 'Dockerfile', '../.dockerignore', 'gradlew', 'gradle.lockfile', fileTree('gradle/wrapper'))
    inputs.property('androidJourneySerial', providers.environmentVariable('RITMO_ANDROID_JOURNEY_SERIAL').orElse(''))
    if (providers.environmentVariable('RITMO_ANDROID_JOURNEY_SERIAL').isPresent()) outputs.upToDateWhen { false }
    inputs.property('androidReaderMatrix', providers.environmentVariable('RITMO_ANDROID_READER_MATRIX').orElse(''))
    if (providers.environmentVariable('RITMO_ANDROID_READER_MATRIX').isPresent()) outputs.upToDateWhen { false }
    inputs.property('androidSerial', providers.environmentVariable('RITMO_ANDROID_SERIAL').orElse(''))
    if (providers.environmentVariable('RITMO_ANDROID_SERIAL').isPresent()) outputs.upToDateWhen { false }
    def androidApk = providers.environmentVariable('RITMO_ANDROID_APK')
    if (androidApk.isPresent()) inputs.file(androidApk.get())
    inputs.files(fileTree('../web/src'), fileTree('../web/scripts'), '../web/coordination.html', '../web/vite.config.ts', '../web/vite.iphone.config.ts', fileTree('../web/iphone'), '../web/package.json', '../web/pnpm-lock.yaml', '../app/src/theme/tokens.ts')
    inputs.property('webCoordination', providers.environmentVariable('RITMO_WEB_COORDINATION').orElse(''))
    if (providers.environmentVariable('RITMO_WEB_COORDINATION').isPresent()) outputs.upToDateWhen { false }
    inputs.property('webIphone', providers.environmentVariable('RITMO_WEB_IPHONE').orElse(''))
    if (providers.environmentVariable('RITMO_WEB_IPHONE').isPresent()) outputs.upToDateWhen { false }
    inputs.property('webBrowser', providers.environmentVariable('RITMO_WEB_BROWSER').orElse(''))
    if (providers.environmentVariable('RITMO_WEB_BROWSER').isPresent()) outputs.upToDateWhen { false }
    inputs.files('../app/package.json', '../app/pnpm-lock.yaml', '../app/tsconfig.json')
    testLogging { events 'passed', 'skipped', 'failed'; exceptionFormat = 'full' }
}

tasks.named('processResources') {
    from('../contracts/primeiro-marco/openapi.json') { into 'contracts' }
    from('../contracts/pwa-m1/openapi.json') { into 'contracts/web' }
}

// Finite operational jobs share check with the API; no scheduler/service is started.
tasks.register('operationsTest', Exec) {
    workingDir 'ops'
    def python = providers.environmentVariable('RITMO_PYTHON').orElse(System.getProperty('os.name').toLowerCase().contains('windows') ? 'python' : 'python3')
    commandLine python.get(), '-m', 'unittest', 'discover', '-p', 'test_operations.py', '-v'
    environment 'PYTHONDONTWRITEBYTECODE', '1'
    inputs.files(fileTree('ops').matching { include '*.py' })
}
tasks.named('check') { dependsOn 'operationsTest' }
