# Reviewed sshd_config.d snippet; global PermitUserEnvironment must be no.
Match User ritmo-probe
    AuthenticationMethods publickey
    PubkeyAuthentication yes
    PasswordAuthentication no
    KbdInteractiveAuthentication no
    AuthorizedKeysFile /etc/ssh/ritmo-probe.keys
    ForceCommand /opt/ritmo/probe-command
    DisableForwarding yes
    PermitTTY no
    PermitUserRC no
Match all
